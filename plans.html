<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Our Future | Purple Sanctuary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/plans.css">
    <script src="js/common.js" defer></script>
    <script src="js/pages/plans.js" defer></script>
</head>
<body data-page="plans">


    <main class="container">
        <header class="page-hero">
            <h1>The Future</h1>
            <div class="subtitle">Everything I dream of doing with you ✨</div>
        </header>

        <div class="glass-card">
            <h2>Our Bucket List 📝</h2>
            <p class="bucket-progress" id="bucket-progress"></p>
            <ul class="bucket-list">
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Finish this digital sanctuary together 🌐</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Graduate college side by side 🎓</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Reach the highest rank in ML together 🎮</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Travel around the world ✈️</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Go on a late night drive with our playlist 🚗</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Build the coziest bed for movie nights 🍿</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Cook our favorite meal together 🍳</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Have a peaceful beach trip, just you and me 🏖️</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Adopt a cute little pet for our future house 🐶</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Build our dream home 🏡</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">See you walk down the aisle ⛪</span>
                </label></li>
                <li><label class="bucket-item">
                    <input type="checkbox" onchange="toggleCheck(this)"> <span class="bucket-text">Grow old and still hold hands 👵👴</span>
                </label></li>
            </ul>
        </div>

        <div class="glass-card">
            <h2>Our Future Home 🏡</h2>
            <p class="card-lead">Our beautiful home lovey. I used a bungalow design as inspiration, I hope it suits your taste baby.</p>
            
            <div class="css-house-scene">
                <div class="night-overlay"></div>
                <div class="sun"></div>
                
                <div class="house-wrapper">
                    <div class="chimney"></div>
                    
                    <div class="main-roof"></div>
                    
                    <div class="dormer">
                        <div class="dormer-roof"></div>
                        <div class="dormer-win left"></div>
                        <div class="dormer-win right"></div>
                    </div>
                    
                    <div class="house-body">
                        <div class="main-win w1"></div>
                        <div class="main-win w2"></div>
                        <div class="door"></div>
                        <div class="main-win w3"></div>
                        <div class="main-win w4"></div>
                    </div>
                    
                    <div class="porch-roof"></div>
                    
                    <div class="column col1"><div class="col-top"></div><div class="col-base"></div></div>
                    <div class="column col2"><div class="col-top"></div><div class="col-base"></div></div>
                    <div class="column col3"><div class="col-top"></div><div class="col-base"></div></div>
                    <div class="column col4"><div class="col-top"></div><div class="col-base"></div></div>
                    
                    <div class="porch-base"></div>
                    <div class="stairs"></div>
                </div>

                <div class="ground">
                    <div class="path"></div>
                    <div class="bush b1"></div>
                    <div class="bush b2"></div>
                    <div class="bush b3"></div>
                    <div class="bush b4"></div>
                    
                    <div class="lamppost">
                        <div class="lamp-top"></div>
                        <div class="lamp-head"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <h2>The Date Decider 🎲</h2>
            <p>Cannot decide. Let fate choose for us lovey.</p>
            <button class="btn" id="spin-btn" onclick="spinWheel()">Spin the wheel</button>
            <div id="decider-result">Ready for a date</div>
        </div>
    </main>

    <div id="tulip-garden" class="garden-container" aria-hidden="true"></div>

</body>
</html>

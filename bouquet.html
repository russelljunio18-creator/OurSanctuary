<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Your Bouquet | Purple Sanctuary</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/pages/bouquet.css">
    <script src="js/common.js" defer></script>
    <script src="js/pages/bouquet.js" defer></script>
</head>
<body data-page="bouquet">

    <main class="container">
        <header class="page-hero">
            <h1>Your Bouquet</h1>
            <div class="subtitle">Every tulip, made for you</div>
        </header>

        <!-- The real bouquet -->
        <figure class="bouquet-photo">
            <div class="bouquet-photo__frame">
                <img src="assets/images/bouquet.jpg" alt="A bouquet of purple, lilac, red and yellow satin ribbon tulips wrapped in white and gold paper">
            </div>
            <figcaption id="photo-caption"></figcaption>
        </figure>

        <!-- Tap a tulip to read its note (the notes live in js/pages/bouquet.js) -->
        <section class="glass-card">
            <h2>Pick a tulip</h2>
            <p class="card-lead">Each one has a little note inside</p>
            <div class="tulip-row" id="tulip-row"></div>
        </section>
    </main>

    <div class="modal-overlay" id="tulipModal" onclick="closeTulip()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeTulip()" aria-label="Close">✕</button>
            <div class="tulip-note" id="tulip-note"></div>
        </div>
    </div>

    <div id="tulip-garden" class="garden-container" aria-hidden="true"></div>

</body>
</html>
